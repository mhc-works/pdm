# Dependabot opens a pull request when an action pinned in .github/workflows has a newer release.
# The gitleaks version in ci.yml is downloaded by hand and is not covered: raise it there, with its SHA-256.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
