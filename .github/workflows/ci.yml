name: CI

on:
  push:
    branches: [main]
  pull_request:

# pull_request, never pull_request_target: code from a fork gets no write access and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"

# Actions are pinned to a commit (tag in the comment).
jobs:
  public-tree:
    name: Nothing private, nothing secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Files and every commit message in the history
        env:
          # Empty on pull requests from forks; the patterns still run.
          PDM_PRIVATE_TERMS: ${{ secrets.PDM_PRIVATE_TERMS }}
        run: |
          python3 tools/check_public.py
          python3 tools/check_public.py --range HEAD
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Install gitleaks (fixed version, checked by SHA-256)
        run: |
          v=$GITLEAKS_VERSION
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - name: Secrets in the tree and the history
        run: gitleaks detect --redact --no-banner --verbose

  devicetest-app:
    name: Device test app builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: devicetest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The runner image brings the Android SDK; unit tests, lint (hard-coded text and missing
      # translations are errors, ADR-0004) and the debug build.
      - name: Test, lint, build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
